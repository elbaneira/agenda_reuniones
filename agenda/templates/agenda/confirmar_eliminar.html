{% extends 'agenda/base.html' %} 
 
{% block title %}Eliminar reunión{% endblock %} 
 
{% block content %} 
<div class="card border-danger"> 
    <div class="card-header bg-danger text-white"> 
        Confirmar eliminación 
    </div> 
    <div class="card-body"> 
        <p>¿Seguro que deseas eliminar la reunión <strong>{{ reunion.titulo }}</strong>?</p> 
        <form method="post"> 
            {% csrf_token %} 
            <button class="btn btn-danger">Sí, eliminar</button> 
            <a href="{% url 'lista_reuniones' %}" class="btn btn-secondary">Cancelar</a> 
        </form> 
    </div> 
</div> 
{% endblock %}
