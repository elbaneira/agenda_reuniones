{% extends 'agenda/base.html' %} 
 
{% block title %}Iniciar sesión{% endblock %} 
 
{% block content %} 
<div class="row justify-content-center"> 
    <div class="col-md-5"> 
        <div class="card"> 
            <div class="card-header"> 
                <h4 class="mb-0">Iniciar sesión</h4> 
            </div> 
            <div class="card-body"> 
                <form method="post"> 
                    {% csrf_token %} 
                    {{ form.as_p }} 
                    <button class="btn btn-primary w-100">Ingresar</button> 
                </form> 
            </div> 
        </div> 
    </div> 
</div> 
{% endblock %}
